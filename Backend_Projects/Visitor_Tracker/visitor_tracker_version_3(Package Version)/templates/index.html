{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Tracker v2.0</title>
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            text-align: center; 
            padding-top: 60px; 
            background: #0f172a; 
            color: #f8fafc; 
        }
        .card { 
            background: #1e293b; 
            padding: 35px; 
            display: inline-block; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            border: 1px solid #334155; 
            max-width: 500px;
        }
        h1 { margin-top: 0; color: #38bdf8; }
        a { color: #38bdf8; text-decoration: none; font-weight: 500; }
        a:hover { text-decoration: underline; }
        .status { 
            margin-top: 20px; 
            font-weight: 600; 
            padding: 12px; 
            background: #0f172a; 
            border-radius: 8px; 
            color: #38bdf8; 
            border: 1px solid #1e293b;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Visitor Tracker v2.0</h1>
        <p>Hybrid Engine: Server Middleware + Client-Side JS Verification</p>
        <p><a href="/admin/">Go to Admin Panel</a></p>
        <div id="detection-status" class="status">🔍 Running Client-Side Verification...</div>
    </div>

<script src="{% static 'js/visitor_tracker.js' %}" defer></script>
</body>
</html>
